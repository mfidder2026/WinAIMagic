# Once a week: can every model in the catalog still be downloaded? Reads headers only, and runs on GitHub's own machines.
# A failed run means a model is gone or different on the server; CLAUDE.md says what to do then.
name: Check model files

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays at 06:17 UTC
  workflow_dispatch:
    inputs:
      test_alarm:
        description: Fail on purpose, to see that the message about a failed run arrives
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_catalog.py --summary "$GITHUB_STEP_SUMMARY"
      - if: ${{ inputs.test_alarm }}
        run: |
          echo "This run fails on purpose: it tests the message about a failed run. No model is broken."
          exit 1
